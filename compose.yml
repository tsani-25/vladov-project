services:

  backend:
    build: ./backend
    container_name: backend

    ports:
      - "3000:3000"

    depends_on:
      - db

  db:
    image: postgres:16

    container_name: postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
